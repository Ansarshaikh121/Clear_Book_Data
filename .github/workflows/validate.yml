name: Validate pull request
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test src/lib/auth/sign-in-gate.test.ts src/lib/budget/worksheet.test.ts src/lib/budget/regression.test.ts src/lib/budget/calendar-data.test.ts
      - run: npm run build:dev
