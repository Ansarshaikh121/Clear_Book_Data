name: Validate pull request
on:
  pull_request:
  push:
    branches:
      - feature/email-otp-verification

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test src/lib/auth/sign-in-gate.test.ts
